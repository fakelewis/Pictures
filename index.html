            }

        ];


        // =========================================================
        // ORDENAÇÃO
        // =========================================================

        /*
         * Primeiro ACE, depois ACS.
         * Dentro de cada grupo, ordem alfabética.
         */

        formandos.sort((a, b) => {

            if (a.categoria !== b.categoria) {
                return a.categoria === "ACE" ? -1 : 1;
            }

            return a.nome.localeCompare(
                b.nome,
                "pt-BR",
                { sensitivity: "base" }
            );
        });


        // =========================================================
        // ELEMENTOS
        // =========================================================

        const conteudo = document.getElementById("conteudo-formando");
        const foto = document.getElementById("foto-formando");
        const nome = document.getElementById("nome-formando");
        const cargo = document.getElementById("cargo-formando");
        const ano = document.getElementById("ano-formando");


        // =========================================================
        // ESTADO
        // =========================================================

        let indiceAtual = 0;


        // =========================================================
        // MOSTRAR FORMANDO
        // =========================================================

        function mostrarFormando(indice) {

            indiceAtual = indice;

            const formando = formandos[indiceAtual];

            conteudo.classList.add("trocando");

            setTimeout(() => {

                foto.src = formando.foto;
                foto.alt = formando.nome;

                nome.textContent = formando.nome;
                cargo.textContent = formando.cargo;

                conteudo.classList.remove("trocando");

            }, 180);
        }


        // =========================================================
        // PRÓXIMO
        // =========================================================

        function proximoFormando() {

            indiceAtual++;

            if (indiceAtual >= formandos.length) {
                indiceAtual = 0;
            }

            mostrarFormando(indiceAtual);
        }


        // =========================================================
        // ANTERIOR
        // =========================================================

        function formandoAnterior() {

            indiceAtual--;

            if (indiceAtual < 0) {
                indiceAtual = formandos.length - 1;
            }

            mostrarFormando(indiceAtual);
        }


        // =========================================================
        // TECLADO
        // =========================================================

        document.addEventListener("keydown", (event) => {

            if (event.key === "ArrowRight") {

                event.preventDefault();

                proximoFormando();

            }

            else if (event.key === "ArrowLeft") {

                event.preventDefault();

                formandoAnterior();

            }

        });


        // =========================================================
        // PRIMEIRO FORMANDO
        // =========================================================

        mostrarFormando(0);

    </script>
